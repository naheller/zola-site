{% extends "base.html" %}

{% block content %}

<div>
{% for page in section.pages %}
  <article>
    <h1>
      <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
    </h1>
    {% if page.description %}
      <p>
        {{ page.description }}
      </p>
    {% endif %}
    {% if page.date %}
      <p class="date">
      <time datetime="{{ page.date }}">
        {{ page.date | date(format="%b %-d, %Y") }}
      </time>
      </p>
    {% endif %}
  </article>
{% endfor %}
</div>

{% endblock content %}
